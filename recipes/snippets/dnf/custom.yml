---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
type: dnf
repos:
  cleanup: true
  files:
    - code.repo
    # winpodx: re-enable once home:Kernalix7 publishes a Fedora_45 build
    # (the Fedora_44 RPM installs into python3.14 site-packages; F45 ships 3.15)
    # - winpodx.repo
  keys:
    - https://packages.microsoft.com/keys/microsoft.asc
install:
  packages:
    - code
    - file-roller
    - fish
    - gh
    - gparted
    - jetbrains-mono-fonts-all
    - kitty
    - kubectl
    - lm_sensors
    # AirDrop (no repo upstream; version bumped by Renovate)
    - https://github.com/t4t5/owly/releases/download/v0.4.2/owly-0.4.2-1.x86_64.rpm
    - podman-compose
    - rsms-inter-fonts
    - uv
    # - winpodx # see repos above
    ## Virtualization
    - edk2-ovmf
    - libvirt
    - libvirt-nss
    - qemu-char-spice
    - qemu-device-display-virtio-gpu
    - qemu-device-display-virtio-vga
    - qemu-device-usb-redirect
    - qemu-img
    - qemu-system-x86-core
    - qemu-user-binfmt
    - qemu-user-static
    - virt-manager
    - virt-v2v
    - virt-viewer

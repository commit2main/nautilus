---
# yaml-language-server: $schema=https://schema.blue-build.org/module-v1.json
type: dnf
repos:
  cleanup: true
  copr:
    - berndserk/talosctl-rpm
    - ublue-os/packages
  files:
    - code.repo
    - kubernetes.repo
    - terra.repo
    - winpodx.repo
  keys:
    - https://packages.microsoft.com/keys/microsoft.asc
install:
  packages:
    - asusctl
    - code
    - file-roller
    - fish
    - gh
    - gparted
    - jetbrains-mono-fonts-all
    - kitty
    - kubectl
    - lm_sensors
    # AirDrop (no repo upstream; version bumped by Renovate)
    - https://github.com/t4t5/owly/releases/download/v0.4.1/owly-0.4.1-1.x86_64.rpm
    - podman-compose
    - rsms-inter-fonts
    - talosctl
    - uv
    - winpodx
    ## Virtualization
    - edk2-ovmf
    - libvirt
    - libvirt-nss
    - qemu
    - qemu-char-spice
    - qemu-device-display-virtio-gpu
    - qemu-device-display-virtio-vga
    - qemu-device-usb-redirect
    - qemu-img
    - qemu-system-x86-core
    - qemu-user-binfmt
    - qemu-user-static
    - ublue-os-libvirt-workarounds
    - virt-manager
    - virt-v2v
    - virt-viewer

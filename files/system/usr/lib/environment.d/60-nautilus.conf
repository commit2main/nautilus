# Read by the systemd user manager, so these reach niri, user services and
# apps regardless of login shell (fish doesn't source /etc/profile.d).

# fcitx5 input method
IMSETTINGS_MODULE=fcitx
GLFW_IM_MODULE=fcitx
SDL_IM_MODULE=fcitx
QT_IM_MODULE=fcitx
INPUT_METHOD=fcitx
XMODIFIERS=@im=fcitx
# GTK_IM_MODULE=wayland

FREETYPE_PROPERTIES="cff:no-stem-darkening=0 autofitter:no-stem-darkening=0"
DMS_PRIVESC=run0
PROTON_USE_NTSYNC=1
